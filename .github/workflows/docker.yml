---

name: docker

on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      name:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile.${{ inputs.distro }}

  build:
    needs:
      - hadolint
    runs-on: ubuntu-latest
    steps:
      -
        name: fetch repo
        uses: actions/checkout@v7
      -
        name: setup buildx
        uses: docker/setup-buildx-action@v4
      -
        name: build image
        run: docker buildx build . --file Dockerfile.${{ inputs.distro }}

  release:
    needs:
      - build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      -
        name: fetch repo
        uses: actions/checkout@v7
      -
        name: gather image metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/idiv-biodiversity/ansible-molecule-${{ inputs.distro }}
          labels: |
            org.opencontainers.image.title=ansible-molecule-${{ inputs.distro }}
            org.opencontainers.image.description=${{ inputs.name }} for Ansible Molecule
          tags: |
            type=raw,value=latest
        id: metadata
      -
        name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}
      -
        name: build and push image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.${{ inputs.distro }}
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: |
            ghcr.io/idiv-biodiversity/ansible-molecule-${{ inputs.distro }}:latest
        id: push
      -
        name: attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/idiv-biodiversity/ansible-molecule-${{ inputs.distro }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

...
